services:
  openmetadata-db:
    profiles: [metadata]
    image: openmetadata/db:1.12.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_DB_ROOT_PASSWORD:?Run init to generate .env}
    volumes:
      - om_db_data:/var/lib/mysql
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -N -e 'USE openmetadata_db' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 25

  openmetadata-search:
    profiles: [metadata]
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - om_es_data:/usr/share/elasticsearch/data
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 25

  openmetadata-migrate:
    profiles: [metadata]
    image: openmetadata/server:1.12.6
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment: &om-env
      OPENMETADATA_CLUSTER_NAME: capstone-local
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_HOST: openmetadata-db
      DB_PORT: "3306"
      OM_DATABASE: openmetadata_db
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      OPENMETADATA_HEAP_OPTS: -Xmx512m -Xms256m
    depends_on:
      openmetadata-db: {condition: service_healthy}
      openmetadata-search: {condition: service_healthy}
    networks: [labnet]
    restart: "no"

  openmetadata-server:
    profiles: [metadata]
    image: openmetadata/server:1.12.6
    restart: unless-stopped
    environment:
      <<: *om-env
    ports:
      - "127.0.0.1:${OPENMETADATA_PORT:-8585}:8585"
    depends_on:
      openmetadata-migrate: {condition: service_completed_successfully}
      openmetadata-db: {condition: service_healthy}
      openmetadata-search: {condition: service_healthy}
    networks: [labnet]

volumes:
  om_db_data: {}
  om_es_data: {}
